name: CI

# Runs typecheck, lint, tests and build on every PR and on pushes to main.
# Every step is blocking.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Matches `engines` in package.json and the production runtime.
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        # Errors fail the build. `--max-warnings` in package.json caps the
        # legacy `any` warnings: new ones fail CI, and the cap only goes down.
        run: npm run lint

      - name: Cache MongoDB binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Test
        # Integration tests boot an in-memory MongoDB replica set and an
        # in-memory Redis stand-in — no external services needed.
        run: npm test

      - name: Build
        run: npm run build
