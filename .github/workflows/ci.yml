name: CI

# Runs typecheck + lint on every PR and on pushes to main.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        # Backend lint may fail on legacy files initially — `continue-on-error`
        # so the PR isn't blocked while we burn down warnings. Flip to `false`
        # once the lint baseline is clean.
        continue-on-error: true
        run: npm run lint

      - name: Build
        run: npm run build
